name: CI Windows Build (No Release)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  STOCKSTUDIO_LICENSE_API_URL: ${{ vars.STOCKSTUDIO_LICENSE_API_URL || 'https://stockstudio-pro-license-api-prod.dekadk00.workers.dev' }}
  STOCKSTUDIO_EXTENSION_ID: ${{ vars.STOCKSTUDIO_EXTENSION_ID || 'ejcjoljemplfeenipjehlhhclbkpialk' }}

jobs:
  windows-ci-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Desktop dependencies
        run: npm ci

      - name: Install Worker API dependencies
        run: npm --prefix workers/license-api ci

      - name: Gate 1 - Validate production release configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:STOCKSTUDIO_LICENSE_API_URL -notmatch '^https://') {
            throw "STOCKSTUDIO_LICENSE_API_URL must use HTTPS."
          }
          if ($env:STOCKSTUDIO_LICENSE_API_URL -match 'staging|flowpilot|localhost|127\.0\.0\.1') {
            throw "STOCKSTUDIO_LICENSE_API_URL must not target staging, flowpilot, or localhost."
          }
          if ($env:STOCKSTUDIO_EXTENSION_ID -notmatch '^[a-p]{32}$') {
            throw "STOCKSTUDIO_EXTENSION_ID must be an exact 32-character Chrome Extension ID."
          }
          $cfg = Get-Content -Raw "src-tauri/crates/stockstudio-license-core/src/config.rs"
          if ($cfg -notmatch 'sspro-ed25519-prod-01' -or $cfg -notmatch 'uy1Hyu3NEm9K1SLIdh2P7CEckfAjKBC8/Cn334jygjc=') {
            throw "EMBEDDED_PROD_VERIFYING_KEYS in config.rs is missing the verified production Ed25519 key."
          }
          Write-Output "Production configuration gate passed."

      - name: Gate 2 - Frontend typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Gate 3 - Rust format and workspace tests (debug + release prod-key verification)
        run: |
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --workspace
          cargo test --release --manifest-path src-tauri/Cargo.toml -p stockstudio-license-core

      - name: Gate 4 - Worker API typecheck and test suite
        run: |
          npm --prefix workers/license-api run typecheck
          npm --prefix workers/license-api test

      - name: Gate 5 - Prepare static-CRT NMH & Chrome Extension validation and packaging
        shell: pwsh
        env:
          STOCKSTUDIO_EXTENSION_DIR: ${{ vars.STOCKSTUDIO_EXTENSION_DIR || 'chrome-extension/vectorize-ai-download' }}
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/prepare-nmh-bundle.mjs
          if (-not (Test-Path $env:STOCKSTUDIO_EXTENSION_DIR)) {
            throw "Chrome Extension directory not found at '$($env:STOCKSTUDIO_EXTENSION_DIR)'."
          }
          $null = Get-Content -Raw (Join-Path $env:STOCKSTUDIO_EXTENSION_DIR "manifest.json") | ConvertFrom-Json
          foreach ($rel in @(
            "background/license-client.js",
            "background/service-worker.js",
            "content/content.js",
            "injected/inject.js",
            "popup/popup.js"
          )) {
            node --check (Join-Path $env:STOCKSTUDIO_EXTENSION_DIR $rel)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/test-extension-license-client.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path "dist-artifacts" | Out-Null
          $extZip = "dist-artifacts/stockstudio-pro-chrome-extension-v0.2.0.zip"
          if (Test-Path $extZip) { Remove-Item -Force $extZip }
          Compress-Archive -Path (Join-Path $env:STOCKSTUDIO_EXTENSION_DIR "*") -DestinationPath $extZip -CompressionLevel Optimal
          if (-not (Test-Path $extZip) -or (Get-Item $extZip).Length -le 0) {
            throw "Failed to package Chrome Extension ZIP artifact at $extZip."
          }
          Write-Output "Packaged Chrome Extension ZIP: $extZip ($((Get-Item $extZip).Length) bytes)"

      - name: Gate 6 - Unified Licensing E2E test
        env:
          STOCKSTUDIO_EXTENSION_DIR: ${{ vars.STOCKSTUDIO_EXTENSION_DIR || 'chrome-extension/vectorize-ai-download' }}
        run: node scripts/test-e2e-unified-licensing.mjs

      - name: Build Windows NSIS installer (unsigned, createUpdaterArtifacts=false)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $overridePath = Join-Path $env:RUNNER_TEMP "tauri-ci-override.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $overridePath -Encoding ascii
          npx tauri build --bundles nsis --config $overridePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $nsisDir -Filter "*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "No NSIS installer .exe found in $nsisDir."
          }
          $sigFiles = @(Get-ChildItem -Path $nsisDir -Filter "*.sig" -ErrorAction SilentlyContinue)
          if ($sigFiles.Count -gt 0) {
            throw "Unexpected updater signature files generated in unsigned CI build: $($sigFiles.Name -join ', ')"
          }
          Write-Output "Built unsigned NSIS installer(s): $($installers.Name -join ', ')"

      - name: Upload Windows CI artifacts (installer + Chrome Extension ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: stockstudio-pro-v0.2.0-windows-ci
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-artifacts/stockstudio-pro-chrome-extension-v0.2.0.zip
          retention-days: 14
          if-no-files-found: error
